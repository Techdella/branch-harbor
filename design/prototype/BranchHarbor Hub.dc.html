<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./bh-shared.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F2EE;color:#141414;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#141414;text-decoration:none}
a:hover{color:#5E7D68}
</style>
<script src="./bh-shell.js"></script>
</helmet>
<bh-topbar active="hub"></bh-topbar>
<div style="max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px">
  <header style="background:#fff;border-radius:32px;padding:clamp(24px,4vw,48px);display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:14px;max-width:720px">
      <div style="display:flex;align-items:center;gap:10px"><bh-logo size="40"></bh-logo><span style="font-size:20px;font-weight:800;letter-spacing:-.02em">BranchHarbor</span></div>
      <h1 style="margin:0;font-size:clamp(36px,5vw,64px);line-height:1.02;font-weight:700;letter-spacing:-.045em">Prototype hub</h1>
      <p style="margin:0;font-size:16px;line-height:1.6;color:#5D5D58">Every surface from the specification, connected. All business names, people and numbers are sample data.</p>
    </div>
    <a href="BranchHarbor Website.dc.html" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 24px;border-radius:999px;background:#141414;color:#fff;font-size:15px;font-weight:700">Start at the website<span style="width:40px;height:40px;border-radius:20px;background:#D6F26B;color:#141414;display:flex;align-items:center;justify-content:center"><bh-icon name="arrow-up-right" size="18"></bh-icon></span></a>
  </header>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:14px">
    <sc-for list="{{ surfaces }}" as="x" hint-placeholder-count="6">
      <a href="{{ x.href }}" style="background:#fff;border-radius:28px;overflow:hidden;display:flex;flex-direction:column">
        <div style="position:relative;height:200px;background:{{ x.pastel }}">
          <img src="{{ x.img }}" alt="" style="width:100%;height:100%;object-fit:cover">
          <span style="position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:700"><bh-icon name="{{ x.icon }}" size="14"></bh-icon>{{ x.kind }}</span>
        </div>
        <div style="padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1">
          <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:21px;font-weight:700;letter-spacing:-.02em">{{ x.name }}</span><span style="width:36px;height:36px;border-radius:18px;background:#141414;color:#fff;display:flex;align-items:center;justify-content:center"><bh-icon name="arrow-up-right" size="16"></bh-icon></span></div>
          <div style="font-size:14px;line-height:1.55;color:#5D5D58">{{ x.desc }}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px">
            <sc-for list="{{ x.tags }}" as="t" hint-placeholder-count="3"><span style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F3F2EE">{{ t }}</span></sc-for>
          </div>
        </div>
      </a>
    </sc-for>
  </div>

  <section style="background:#fff;border-radius:28px;padding:clamp(20px,3vw,36px);display:flex;flex-direction:column;gap:14px">
    <h2 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em">The 12 prototype scenarios</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px">
      <sc-for list="{{ scenarios }}" as="s" hint-placeholder-count="12">
        <a href="{{ s.href }}" style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:#F8F7F3">
          <span style="width:40px;height:40px;border-radius:14px;background:{{ s.pastel }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">{{ s.n }}</span>
          <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700;line-height:1.35">{{ s.t }}</span><span style="font-size:12px;color:#5D5D58">{{ s.where }}</span></span>
          <bh-icon name="chevron-right" size="16"></bh-icon>
        </a>
      </sc-for>
    </div>
  </section>
  <footer style="padding:8px 12px 24px;font-size:11px;line-height:1.6;color:#5D5D58">{{ credits }}</footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const I = window.BH_IMG || {};
    const W = 'BranchHarbor Website.dc.html', O = 'BranchHarbor Onboarding.dc.html', A = 'BranchHarbor App.dc.html', C = 'BranchHarbor Customer Flows.dc.html', WP = 'BranchHarbor WordPress Plugin.dc.html', S = 'BranchHarbor Prototypes v2.dc.html';
    const pal = ['#E9DDF8', '#E2F5A6', '#D4E6D9', '#F7EDA8', '#F8D6D8', '#CDEEEE'];
    return {
      credits: window.BH_CREDITS || '',
      surfaces: [
        ['BranchHarbor Brand Sheet.dc.html', 'Brand sheet', 'Brand', 'palette', I.meet3, 'BranchHarbor logo system, construction, colour, typography, iconography, UI shapes, applications and voice.', ['Logo', 'Colour · type', 'Applications']],
        ['BranchHarbor Business.dc.html', 'Business suite', 'HQ & location', 'wallet', I.meet2, 'Finance (royalties, marketing fund, payouts, reconciliation), reports, staff scheduling, inventory & suppliers, training, help desk, and settings & billing.', ['Royalties', 'Rostering', 'LMS · Help desk']],
        ['BranchHarbor Customer App.dc.html', 'Customer mobile app', 'Customer · 6 industries', 'phone', I.onlineYoga, 'Branded app per franchise: home, booking or ordering, waitlists, my bookings, inbox with the location, and preferences.', ['Book · order · register', 'Inbox']],
        ['BranchHarbor Mobile Consoles.dc.html', 'Mobile consoles', 'HQ & owner · mobile', 'phone', I.team1, 'HQ and franchise owners on the go: pulse, approvals (ads, refunds, shift swaps), messages and quick links into the full consoles.', ['Approvals', 'Pulse']],
        ['BranchHarbor Marketing.dc.html', 'Marketing & sales suite', 'HQ & location', 'megaphone', I.mktLaptop, 'Unified inbox (WhatsApp, SMS, Instagram, Messenger, email), sales pipeline, contacts and segments, lead routing, email builder, SMS, WhatsApp templates, automation builder and HQ-owned social accounts with access handover.', ['Social ownership', 'WhatsApp · SMS', 'Automations']],
        ['BranchHarbor New Location.dc.html', 'Open a new location', 'HQ & new owner', 'flag', I.meet1, 'From signed agreement to opening: location details, one-click provisioning from templates, owner invite, the owner\u2019s first-run checklist and HQ go-live approval.', ['Provisioning', 'Owner checklist', 'Go-live gates']],
        ['BranchHarbor HQ.dc.html', 'Headquarters console', 'HQ · franchisor', 'building', I.meet3, 'Network map, franchise development pipeline, franchisees, autonomy tiers, account managers, brand center, policies & legal, ads, social, email, automations and community. Six industries.', ['Franchise flow', 'Meta · LinkedIn · Google', 'Real Estate']],
        ['BranchHarbor Location.dc.html', 'Franchisee & location', 'Owner · manager', 'store', I.yogaStudio, 'What a franchise owner or location manager sees: daily operations, their website with HQ locks, local marketing within their tier, policies to confirm and their account manager.', ['Autonomy shown everywhere', 'WooCommerce', 'Online classes']],
        ['BranchHarbor Staff.dc.html', 'Staff app', 'Staff · mobile', 'phone', I.foodCook, 'Instructors, coaches, practitioners, store associates, kitchen and agents: shifts, check-in, attendance, picking, viewings and messages from HQ.', ['6 roles', 'Privacy by role']],
        ['BranchHarbor Location Sites.dc.html', 'Customer websites', 'Customer', 'globe', I.reModern, 'Brand site with location finder, each location\u2019s own website, booking, waitlists, online class player, WooCommerce shop, pickup ordering, listings and customer account.', ['Location finder', 'Booking & shop', 'Account']],
        [W, 'Public website', 'Website', 'globe', I.yogaGroup, 'Home, five industry pages, franchises, independent businesses, WordPress, integrations, pricing, demo, resources, support, about and policies.', ['16 routes', 'Demo request', 'Mobile menu']],
        [O, 'Account & setup', 'Onboarding', 'user', I.yogaRoom, 'Sign up, email verification, the 9-step checklist, location wizard with CSV import, website address and custom domain connection.', ['Scenario 2', 'DNS states', 'Save progress']],
        [A, 'Business app', 'App · 5 industries', 'grid', I.foodTeam, 'Studios, Sports, Wellness, Commerce and Foods dashboards with shared Locations, Websites, Marketing, Payments, Team, Reports and Connections.', ['Scenarios 5, 7, 8, 9, 12', 'Scope selector', 'AI panel']],
        [C, 'Customer flows', 'Customer · 5 industries', 'phone', I.shopPay, 'What customers see: book a class, register a child, book and reschedule a massage, shop and return, order pickup food.', ['Mobile frames', 'Error recovery']],
        [WP, 'WordPress connector', 'Plugin', 'wordpress', I.yogaStretch, 'Activation, consent, plugin detection, scoped authorisation, multisite mapping error, data direction, tests, blocks, compatibility and status.', ['Scenario 3', 'Block editor', 'Connection states']],
        [S, 'Scenario walkthroughs', 'Scenarios', 'play', I.foodChef, 'Focused versions of HQ publishing with partial failure, studio booking and cover, kitchen view and AI campaign.', ['Scenarios 1, 4, 6, 10, 11']],
      ].map(([href, name, kind, icon, img, desc, tags], i) => ({ href, name, kind, icon, img: img || '', desc, tags, pastel: pal[i] })),
      scenarios: [
        ['Visitor chooses industry and requests a demo', 'Website · Demo', W], ['Hosted customer sets up, previews and connects a domain', 'Onboarding', O],
        ['WordPress customer authorises and resolves a mapping error', 'WordPress connector', WP], ['HQ publishes a shared change; one location fails and is retried', 'Scenarios · HQ publish', S],
        ['Local manager edits an allowed field and requests approval', 'App · Websites', A], ['Studio customer books or joins a waitlist; manager handles cover', 'Scenarios · Studio', S],
        ['Guardian registers a participant; coach checks attendance', 'Customer flows + App · Sports', C], ['Wellness customer books and reschedules safely', 'Customer flows · Wellness', C],
        ['Commerce order syncs and a partial refund is recorded', 'App · Commerce orders', A], ['Food customer orders pickup; kitchen updates status', 'Customer flows + Scenarios · Kitchen', C],
        ['AI drafts a multi-location campaign; scope is reviewed', 'Scenarios · AI campaign', S], ['Payment succeeds but fulfilment fails; reconciliation recovers it', 'App · Payments', A],
      ].map(([t, where, href], i) => ({ n: String(i + 1).padStart(2, '0'), t, where, href, pastel: pal[i % 6] })),
    };
  }
}

</script>
</body>
</html>
