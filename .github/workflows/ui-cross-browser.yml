name: UI cross-browser
on:
  push:
    branches: [main]
  pull_request:

# Builds the four front ends, starts them against a seeded API and runs tools/ui-audit smoke tests in
# Chromium, Firefox, WebKit, Mobile Safari (WebKit iPhone) and Mobile Chrome (Pixel).
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bh
          POSTGRES_PASSWORD: bh
          POSTGRES_DB: branchharbor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bh:bh@localhost:5432/branchharbor
      SEED_DEMO_PASSWORD: HarborDemo2026!
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:6400
      UI_AUDIT_API_URL: http://localhost:6400
      UI_AUDIT_WEB_URL: http://localhost:6401
      UI_AUDIT_APP_URL: http://localhost:6402
      UI_AUDIT_SITES_URL: http://localhost:6403
      UI_AUDIT_MOBILE_URL: http://localhost:6404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: tools/ui-audit
        run: npx playwright install --with-deps
      - name: Migrate and seed the API database
        run: pnpm --filter @bh/api db:migrate && pnpm --filter @bh/api db:seed
      - name: Build apps
        run: |
          NEXT_PUBLIC_APP_URL=http://localhost:6402 NEXT_PUBLIC_SITE_URL=http://localhost:6401 pnpm --filter @bh/web build
          NEXT_PUBLIC_USE_MOCKS=true pnpm --filter @bh/app build
          SITES_BASE_URL=http://localhost:6403 pnpm --filter @bh/sites build
          cd apps/mobile && EXPO_PUBLIC_USE_MOCKS=true npx expo export --platform web --output-dir dist
      - name: Start servers
        run: |
          (cd apps/api && PORT=6400 CORS_ORIGINS=http://localhost:6401,http://localhost:6402,http://localhost:6403,http://localhost:6404 LOG_LEVEL=warn nohup pnpm start > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup npx next start --port 6401 > /tmp/web.log 2>&1 &)
          (cd apps/app && nohup npx next start --port 6402 > /tmp/app.log 2>&1 &)
          (cd apps/sites && SITES_BASE_URL=http://localhost:6403 API_URL=http://localhost:6400 nohup npx next start --port 6403 > /tmp/sites.log 2>&1 &)
          (nohup node tools/ui-audit/serve-static.mjs apps/mobile/dist 6404 > /tmp/mobile.log 2>&1 &)
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:6400/health http://localhost:6401/en http://localhost:6402/sign-in http://localhost:6403/stillwater-yoga http://localhost:6404
      - name: Smoke tests (all browsers)
        working-directory: tools/ui-audit
        run: npx playwright test
      - name: UI audit (smoke matrix, Chromium)
        if: always()
        working-directory: tools/ui-audit
        run: node audit.mjs --mode=smoke --label=ci --no-shots && node report.mjs --label=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-cross-browser
          path: |
            tools/ui-audit/playwright-report
            tools/ui-audit/report/SUMMARY-ci.md
            /tmp/*.log
          retention-days: 7
