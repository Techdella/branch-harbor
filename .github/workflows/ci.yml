name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bh
          POSTGRES_PASSWORD: bh
          POSTGRES_DB: branchharbor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bh:bh@localhost:5432/branchharbor
      TEST_DATABASE_URL: postgres://bh:bh@localhost:5432/branchharbor_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bh/web --filter @bh/app build
