# Fly.io config for the BranchHarbor API. Create the app with `fly launch --no-deploy --copy-config`,
# set secrets with `fly secrets set ...` (see docs/DEPLOYMENT.md), then `fly deploy`.
app = "branchharbor-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/api.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
