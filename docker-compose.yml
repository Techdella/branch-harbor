services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bh
      POSTGRES_PASSWORD: bh
      POSTGRES_DB: branchharbor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
